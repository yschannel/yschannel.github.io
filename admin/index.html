<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>写作台 · yschannel</title><link rel="stylesheet" href="editor.css"></head><body>
<header class="app-header"><a class="wordmark" href="#">yschannel <span>WRITING DESK</span></a><div class="account"><span id="account-status">正在连接…</span><a id="login-link" href="/auth/login" hidden>用 GitHub 登录</a><button id="logout" type="button" hidden>退出登录</button></div></header>
<div class="workspace"><aside class="draft-panel"><div class="draft-heading"><h1>草稿匣</h1><button id="new-draft" type="button">＋ 新文章</button></div><p class="panel-note">先记下来，再慢慢整理。</p><div id="draft-list" aria-label="文章草稿"></div><div class="management-entry"><button id="manage-articles" type="button" disabled>文件管理</button><button id="open-trash" type="button" disabled>回收站</button><button id="delete-draft" class="danger-text" type="button" disabled>删除当前草稿</button></div><div class="backup-tools"><button id="export-draft" type="button">导出当前草稿</button><button id="import-draft" type="button">导入草稿</button><input id="import-file" type="file" accept=".json,application/json" hidden></div></aside>
<main class="writing-area"><div id="connection-note" class="connection-note" role="status"></div><div class="document-actions"><span id="save-status" role="status" aria-live="polite">准备写作</span><div><button id="preview" type="button">预览</button><button id="save-draft" type="button">保存草稿</button><button id="publish" class="primary" type="button" disabled>发布文章 ↗</button></div></div>
<section class="manuscript" aria-label="文章编辑"><div class="manuscript-kicker">A THOUGHT WORTH KEEPING</div><label class="sr-only" for="title">文章标题</label><input id="title" class="title-input" maxlength="180" placeholder="给这篇文章起个名字…"><div class="metadata"><label>分类<input id="tag" list="category-options" maxlength="40" value="随笔"><datalist id="category-options"><option>随笔</option><option>札记</option><option>日常</option><option>项目手记</option><option>动漫</option></datalist></label><label>发布日期<input id="published-at" type="date"></label><label class="slug-label">文章链接<input id="slug" maxlength="101" pattern="[a-z0-9][a-z0-9-]*"></label></div><label class="intro-label" for="intro">文章简介 <span>选填</span></label><textarea id="intro" rows="2" maxlength="1000" placeholder="写几句话，介绍这篇文章…"></textarea>
<div class="editor-toolbar" role="toolbar" aria-label="正文格式"><select id="text-style" aria-label="段落样式"><option value="paragraph">正文</option><option value="h2">二级标题</option><option value="h3">三级标题</option></select><span class="toolbar-divider"></span><button type="button" data-command="bold" aria-label="加粗" title="加粗 Ctrl+B"><b>B</b></button><button type="button" data-command="italic" aria-label="斜体" title="斜体 Ctrl+I"><i>I</i></button><button type="button" data-command="underline" aria-label="下划线" title="下划线"><u>U</u></button><button type="button" data-command="bulletList" aria-label="无序列表">• 列表</button><button type="button" data-command="orderedList" aria-label="有序列表">1. 列表</button><button type="button" data-command="blockquote" aria-label="引用">“ 引用</button><button type="button" data-command="codeBlock" aria-label="代码块">〈/〉</button><button type="button" id="add-link">链接</button><button type="button" id="add-spoiler" aria-pressed="false" title="把当前段落或选中的多个段落放入剧透折叠块，再点一次取消折叠">剧透折叠</button><button type="button" id="add-image">＋ 图片</button><button type="button" data-command="undo" aria-label="撤销">↶</button><button type="button" data-command="redo" aria-label="重做">↷</button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></div>
<div id="spoiler-fields" class="spoiler-fields" hidden><label>读者看到的提示文字<input id="spoiler-label" maxlength="120" placeholder="例如：包含第 3 集剧情，点击展开"></label><button id="leave-spoiler" type="button">结束折叠，继续正文 ↓</button><span>区域内的内容发布后默认收起。再点“剧透折叠”可取消折叠。</span></div><div id="editor" aria-label="文章正文"></div><div class="image-fields" id="image-fields" hidden><label>图片替代文字<input id="image-alt" maxlength="500" placeholder="描述图片内容，便于无障碍阅读"></label><label>图片说明<input id="image-caption" maxlength="500" placeholder="选填，显示在图片下方"></label></div><div class="document-footer"><span id="word-count">0 字</span><span>可直接粘贴图片 · Ctrl+S 保存草稿</span></div></section>
<div class="publish-result" id="publish-result" hidden role="status"></div><p class="privacy-note">未发布的草稿不会写入公开仓库。建议定期导出一份备份。</p></main></div>
<dialog id="preview-dialog"><div class="dialog-heading"><h2>文章预览</h2><button id="close-preview" type="button">✕ 关闭预览</button></div><article class="preview-paper" id="preview-content"></article></dialog>
<dialog id="link-dialog"><form id="link-form"><h2>插入链接</h2><label for="link-url">网址</label><input id="link-url" type="url" placeholder="https://…" required><div class="dialog-buttons"><button id="cancel-link" type="button">取消</button><button class="primary" type="submit">应用链接</button></div></form></dialog>
<dialog id="publish-dialog"><div class="publish-review"><span class="manuscript-kicker">READY TO SHARE?</span><h2>发布这篇文章</h2><p id="publish-review-text"></p><p id="publish-mode-note"></p><div class="dialog-buttons"><button id="cancel-publish" type="button">再检查一下</button><button id="confirm-publish" class="primary" type="button">确认发布</button></div></div></dialog>
<dialog id="manage-dialog" aria-labelledby="manage-title"><div class="dialog-heading"><h2 id="manage-title">文件管理</h2><button id="close-manage" type="button">✕ 关闭</button></div><p id="manage-description" class="management-note"></p><div id="file-sections" class="file-sections"><button type="button" data-section="published" class="published-tab" aria-pressed="true">已发布文章</button><button type="button" data-section="unpublished" class="unpublished-tab" aria-pressed="false">草稿 / 未发布</button></div><div class="management-filters"><label class="sr-only" for="manage-search">查找文章或草稿</label><input id="manage-search" type="search" placeholder="查找标题或分类…"><button id="refresh-manage" type="button">刷新</button><button id="empty-trash" type="button" class="danger-text" hidden>清空回收站</button></div><div class="batch-toolbar"><label><input id="select-visible" type="checkbox"> 全选当前结果</label><span id="selected-count">已选 0 项</span><button id="clear-selection" type="button">取消选择</button><div id="batch-actions"></div></div><p id="manage-state" role="status"></p><div id="manage-list"></div></dialog>
<dialog id="manage-confirm" aria-labelledby="manage-confirm-title"><h2 id="manage-confirm-title"></h2><p id="manage-confirm-name"></p><p id="manage-confirm-note" class="management-note"></p><label id="purge-label" hidden>请输入“永久删除”确认<input id="purge-phrase" type="text" autocomplete="off" placeholder="永久删除"></label><div class="dialog-buttons"><button id="cancel-manage-action" type="button">取消</button><button id="confirm-manage-action" class="primary" type="button">确认</button></div></dialog>
<div id="toast" class="toast" role="alert" hidden></div><script type="module" src="editor.js"></script></body></html>
